[package]
name = "vsm-ocr"
version = "1.0.0"
edition = "2021"
description = "VSM-OCR : Volet de Synthèse Médicale local (wrapper desktop Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
